name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint (isort)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install with dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Check import sorting
        run: python -m isort --check-only --diff .

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # bash ships on the runner; zsh is needed for the shell-integration tests
      # (they auto-skip when a shell is missing, but we want them to actually run).
      - name: Install zsh
        run: |
          # Some preinstalled third-party apt repos (Microsoft's) intermittently
          # serve invalid signatures and make `apt-get update` exit non-zero on the
          # runner image. We only need zsh from the base Ubuntu archive, so remove
          # any repo pointing at packages.microsoft.com before updating.
          ms=$(grep -rl packages.microsoft.com /etc/apt/sources.list.d/ 2>/dev/null || true)
          if [ -n "$ms" ]; then echo "$ms" | sudo xargs rm -f; fi
          sudo apt-get update
          sudo apt-get install -y zsh
      - name: Install with dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run tests
        run: python -m pytest -q
